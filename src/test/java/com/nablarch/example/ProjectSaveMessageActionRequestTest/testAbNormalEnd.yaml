setup_tables:
  - group_id: "1"
    table: "PROJECT_INS_REQ"
    rows:
      - PROJECT_INS_REQ_ID: "1"
        PROJECT_NAME: "プロジェクト００１"
        PROJECT_TYPE: "development"
        PROJECT_CLASS: "s"
        PROJECT_START_DATE: "20160101"
        PROJECT_END_DATE: "20180304"
        CLIENT_ID: "1.0"
        PROJECT_MANAGER: "鈴木"
        PROJECT_LEADER: "佐藤"
        USER_ID: "100.0"
        NOTE: "備考欄"
        SALES: "10000"
        COST_OF_GOODS_SOLD: "1000.0"
        SGA: "2000.0"
        ALLOCATION_OF_CORP_EXPENSES: "3000.0"
        STATUS: "0"
        INSERT_DATE: "20140203"
        UPDATE_DATE: "20140203"

response_header_messages:
  - group_id: "case1"
    id: "ProjectSaveMessage"
    directives:
      file-type: "Fixed"
      record-separator: "CRLF"
      text-encoding: "UTF-8"
    records:
      - record_type: "no"
        fields:
          - {name: "リクエストID", type: "半角", length: "24"}
          - {name: "再送要求フラグ", type: "半角", length: "1"}
          - {name: "予備領域", type: "半角", length: "9"}
        rows:
          - ["ProjectSaveMessage", "", ""]
  - group_id: "case2"
    id: "ProjectSaveMessage"
    directives:
      file-type: "Fixed"
      record-separator: "CRLF"
