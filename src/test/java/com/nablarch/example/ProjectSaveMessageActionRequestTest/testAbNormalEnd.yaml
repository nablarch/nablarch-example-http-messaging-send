      - no: "1"
        description: "メッセージの送信に失敗した場合(タイムアウト)"
        expectedStatusCode: "100"
        setUpTable: "1"
        expectedTable: "1"
        expectedFile: ""
        expectedLog: "expectedLog1"
        diConfig: "http-messaging-send-boot.xml"
        requestPath: "ProjectSaveMessageAction"
        userId: "batch_user"
        expectedMessageByClient: "case1"
        responseMessageByClient: "case1"
      - no: "2"
        description: "メッセージ送受信エラーが発生する場合"
        expectedStatusCode: "100"
        setUpTable: "1"
        expectedTable: "1"
        expectedFile: ""
        expectedLog: "expectedLog1"
        diConfig: "http-messaging-send-boot.xml"
